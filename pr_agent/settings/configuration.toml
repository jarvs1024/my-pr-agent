# Important: This file contains all available configuration options.
# Do not copy this entire file to your repository configuration.
# Your repository configuration should only include options you wish to override from the defaults.

[config]
# models
model="gpt-5.5-2026-04-23"
fallback_models=["gpt-5.4-mini"]
#model_reasoning="gpt-5.4-mini" # dedicated reasoning model for self-reflection
#model_weak="gpt-5.4-nano" # optional, a weaker model to use for some easier tasks
# CLI
git_provider="github"
publish_output=true
publish_output_progress=false
progress_gif_url="" # optional, override for the progress loading gif url (example: 'https://.../spinner.gif').
progress_gif_width=48 # optional, width (in px) of the progress loading gif.
verbosity_level=0 # 0,1,2
use_extra_bad_extensions=false
# Log
log_level="DEBUG"
# Configurations
use_wiki_settings_file=true
use_repo_settings_file=true
use_global_settings_file=true
extra_config_url="" # optional URL or path to an additional .pr_agent.toml merged before the repo-local config; also settable via --extra_config_url or PR_AGENT_EXTRA_CONFIG_URL. See docs/docs/usage-guide/configuration_options.md#external-configuration-url.
disable_auto_feedback = false
ai_timeout=120 # 2 minutes
skip_keys = []
custom_reasoning_model = false # when true, disables system messages and temperature controls for models that don't support chat-style inputs
response_language="zh-CN" # Language locales code for PR responses in ISO 3166 and ISO 639 format (e.g., "en-US", "it-IT", "zh-CN", ...)
repo_context_files = ["AGENTS.md"] # Repository-relative files (e.g. AGENTS.md, CLAUDE.md) to include as AI prompt context; set to [] to disable
repo_context_from_default_branch = true # Read repo context files from the repository default branch (trusts only default-branch content). Set to false to read from the PR target branch instead.
repo_context_max_lines = 500 # Maximum total rendered lines for repo context, including wrapper tags
# token limits
max_description_tokens = 500
max_commits_tokens = 500
max_model_tokens = 32000 # Limits the maximum number of tokens that can be used by any model, regardless of the model's default capabilities.
custom_model_max_tokens=-1 # for models not in the default list
model_token_count_estimate_factor=0.3 # factor to increase the token count estimate, in order to reduce likelihood of model failure due to too many tokens - applicable only when requesting an accurate estimate.
# patch extension logic
patch_extension_skip_types =[".md",".txt"]
allow_dynamic_context=true
max_extra_lines_before_dynamic_context = 10 # will try to include up to 10 extra lines before the hunk in the patch, until we reach an enclosing function or class
patch_extra_lines_before = 5 # Number of extra lines (+3 default ones) to include before each hunk in the patch
patch_extra_lines_after = 1 # Number of extra lines (+3 default ones) to include after each hunk in the patch
secret_provider="" # "" (disabled), "google_cloud_storage", or "aws_secrets_manager" for secure secret management
cli_mode=false
output_relevant_configurations=false
large_patch_policy = "clip" # "clip", "skip"
duplicate_prompt_examples = false
# seed
seed=-1 # set positive value to fix the seed (and ensure temperature=0)
temperature=0.2
# ignore logic
ignore_pr_title = ["^\\[Auto\\]", "^Auto"] # a list of regular expressions to match against the PR title to ignore the PR agent
ignore_pr_target_branches = [] # a list of regular expressions of target branches to ignore from PR agent when an PR is created
ignore_pr_source_branches = [] # a list of regular expressions of source branches to ignore from PR agent when an PR is created
ignore_pr_labels = [] # labels to ignore from PR agent when an PR is created
ignore_pr_authors = [] # authors to ignore from PR agent when an PR is created
ignore_repositories = [] # a list of regular expressions of repository full names (e.g. "org/repo") to ignore from PR agent processing
ignore_language_framework = [] # a list of code-generation languages or frameworks (e.g. 'protobuf', 'go_gen') whose auto-generated source files will be excluded from analysis
#
restricted_mode = false # when true, skip operations that require elevated permissions (e.g. pushing code to the repository)
is_auto_command = false # will be auto-set to true if the command is triggered by an automation
# Bot-account usernames whose webhooks should still run commands. Used to let
# a CI job that posts on behalf of a service account (e.g. ``review-bot``)
# trigger /review or /improve without being dropped by the bot-echo guard.
allowed_bot_usernames = []
enable_ai_metadata = false # will enable adding ai metadata
reasoning_effort = "medium" # "none", "minimal", "low", "medium", "high", "xhigh"
# extended thinking for Claude reasoning models
enable_claude_extended_thinking = false # Set to true to enable extended thinking feature
extended_thinking_budget_tokens = 2048
extended_thinking_max_output_tokens = 4096
# Optional: override the built-in list of Claude models that receive the extended-thinking payload.
# When non-empty, this list fully replaces the built-in defaults (see CLAUDE_EXTENDED_THINKING_MODELS
# in pr_agent/algo/__init__.py). Leave empty to use the defaults.
claude_extended_thinking_models_override = []
# Extract issue number from PR source branch name (e.g. feature/1-auth-google -> issue #1). When true, branch-derived
# issue URLs are merged with tickets from the PR description for compliance. Set to false to restore description-only behaviour.
# Note: Branch-name extraction is GitHub-only for now; other providers planned for later.
extract_issue_from_branch = true
# Optional: custom regex with exactly one capturing group for the issue number (validated at runtime; falls back
# to default if missing). If empty, uses default pattern: first 1-6 digits at start of branch or after a slash,
# followed by hyphen or end (e.g. feature/1-test, 123-fix). GitHub only; other providers planned for later.
branch_issue_regex = ""


[pr_reviewer] # /review #
# enable/disable features
require_score_review=false
require_tests_review=true
require_estimate_effort_to_review=true
require_can_be_split_review=false
require_security_review=true
require_estimate_contribution_time_cost=false
require_todo_scan=false
require_ticket_analysis_review=true
# general options
publish_output_no_suggestions=true # Set to "false" if you only need the reviewer's remarks (not labels, not "security audit", etc.) and want to avoid noisy "No major issues detected" comments.
persistent_comment=true
extra_instructions = """
全部用中文 (zh-CN) 输出, 包括各列表面板 ("Estimated effort to review" / "No relevant tests" / "Security concerns" / "Recommended focus areas for review" / "No major issues detected")、推荐建议正文和 Markdown 标题都不要英文。

"Security concerns" 这一栏如果命中违规 (即使 PR 声称 "No."), 必须在结论之后立即列出一个 ```` ```python ```` 代码片段, 引用 PR diff 中的 ``existing_code`` 行, 并附上文件路径和行号 (用 `<file:///path/to/file.py#Lstart-Lend>` 或 GitLab blob 链接); 这段代码片段必须涵盖违规所在的最小可重复单元 (至少 5~10 行业务上下文), 不能只给一行甚至一个空行示例。命中 AGENTS.md 的规则 (例如 ZLG-RULE-*) 时也要在 "Recommended focus areas for review" 里逐条 cite, 且每一条 cite 同样附 ```` ```python ```` 片段的 minimum reproducible snippet。
"""
num_max_findings = 3
final_update_message = true
# review labels
enable_review_labels_security=true
enable_review_labels_effort=true
# specific configurations for incremental review (/review -i)
require_all_thresholds_for_incremental_review=false
minimal_commits_for_incremental_review=0
minimal_minutes_for_incremental_review=0
enable_intro_text=true
enable_help_text=false # Determines whether to include help text in the PR review. Enabled by default.

[pr_description] # /describe #
publish_labels=false
add_original_user_description=false
generate_ai_title=false
use_bullet_points=true
extra_instructions = """
描述正文、MERGE_REQUEST description、标题建议、bullet points、生成示例、change-log 段落全部用中文 (zh-CN) 输出。仅在以下情况才使用英文: 文件名/路径、commit hash、Markdown 围栏内代码本身、第三方库的标识符或工程专有名词。不要留 "Add X" / "Bring code into shape" 这样的英文短语; 改成 `修改 X` / `让代码符合项目规约` 之类的中文。描述里不要保留任何英文 PR 模板头 ("Bringing ...", "Change-log:" 等都翻译成中文)。
"""
enable_pr_type=false
final_update_message = true
enable_help_text=false
enable_help_comment=false
enable_pr_diagram=false # adds a section with a diagram of the PR changes
# describe as comment
publish_description_as_comment=false
publish_description_as_comment_persistent=true
## changes walkthrough section
enable_semantic_files_types=false
collapsible_file_list='adaptive' # true, false, 'adaptive'
collapsible_file_list_threshold=6
inline_file_summary=false # false, true, 'table'
# markers
use_description_markers=false
enable_large_pr_handling=true
include_generated_by_header=true
#custom_labels = ['Bug fix', 'Tests', 'Bug fix with tests', 'Enhancement', 'Documentation', 'Other']
max_ai_calls=4
async_ai_calls=true
[pr_questions] # /ask #
enable_help_text=false
use_conversation_history=true
extra_instructions = ""


[pr_code_suggestions] # /improve #
# commitable_code_suggestions=true switches /improve from summarized-table mode
# to inline-diff-comment mode. In inline mode each suggestion is published as a
# GitLab DiffNote (positioned on the source line) with a ```suggestion``` block,
# which makes GitLab render the native "Apply suggestion" button. The author
# still has to confirm in GitLab's review dialog before the change is committed,
# which is the human-in-the-loop step this fork is designed for.
commitable_code_suggestions = true
# Cap the number of inline suggestions per /improve invocation so a noisy
# review cannot blow the prompt budget.
num_code_suggestions = 5
# Ask the LLM to put the new code into the ``improved_code`` field,
# without nested ```` ``` ```` fences inside that field (they leak into the
# final suggestion block and confuse GitLab).
#
# Project-rule handling: do NOT hard-code any rule keys here. The repo's
# AGENTS.md / CLAUDE.md is already injected into the prompt at runtime via
# ``repo_context_files`` (see ``[config]``). The instructions below tell the
# LLM to discover rule keys from that injected context, so the same config
# works for any project whose conventions live in AGENTS.md.
extra_instructions = """
每条建议请把建议后的代码完整填入 YAML 的 ``improved_code`` 字段, 不要在 ``improved_code`` 内重复添加 ```` ``` ```` 标记; pr-agent 会自动用 ```suggestion 块包住 improved_code, 用户在 GitLab UI 上可以直接点击 "Apply suggestion" 按钮。

``improved_code`` 必须是针对 PR diff 的最小变更: 不要为了"自包含"而在 ``improved_code`` 里塞 ``import`` 语句, 也不要重写文件里已有但本次 diff 没涉及的 import. 规则:
- 只改 diff 实际涉及的代码行 (function body / 表达式 / 局部逻辑); 顶部 / 文件其它位置的 ``import`` 不属于本次 diff 的范围, 让它们原样保留.
- 如果改动后的代码用到了当前 diff 行范围外、但同一文件其它位置已有的 import (例如文件顶部已经 ``import json``, 本次只把 ``pickle.loads`` 换成 ``json.loads``), 不要在 ``improved_code`` 里再写 ``import json``: Apply 后文件顶部已有, 不需要重复.
- 如果改动后的代码用到了一个**文件里完全没出现**的 import (例如 diff 是新增的独立函数, 函数体里用到 ``hmac`` 但文件其它位置没有 ``import hmac``), **必须**为缺失的 import 单独发一条 suggestion, 不要把 import 直接塞进函数体的 ``improved_code`` 里 (否则会成为函数内局部 import, 反而破坏风格).
  这条 import-suggestion 的 ``existing_code`` 必须引用**当前 import 块的最后一行** (diff 里实际存在的 import 行), ``improved_code`` 是该行加上新 import 行; ``suggestion_content`` 必须明确告诉用户"在文件顶部 import 块末尾追加此行". 例:
    relevant_file: "review_fixture.py"
    relevant_lines_start: 4   # 指向现有最后一行 import, 这个行号在 diff 中
    relevant_lines_end: 4
    existing_code: "import base64"
    improved_code: "import base64\nimport json"
    suggestion_content: "函数体用了 ``json.loads`` 但文件顶部未导入 ``json``, Apply 本条会在文件顶部 import 块末尾追加 ``import json``."
- 同样的规则也用于删除 dead import (例如文件顶部 ``import pickle`` 但 ``pickle`` 在 ``improved_code`` 已不再被使用): 也单独发一条 suggestion, ``existing_code`` 是该 import 行, ``improved_code`` 是空行或下一个相邻 import 行.
- 不要在 ``improved_code`` 里写 ``from __future__ import ...`` 之类的元语句.

``suggestion_content``、``label`` 等文字字段必须用中文 (zh-CN) 输出, 包括 importance 评分标签后的描述。

如果本次评审的上下文里注入了 ``AGENTS.md`` / ``CLAUDE.md`` (见 ``[config].repo_context_files``), 把它当作本仓库的最高优先规约来源:
- 先扫描注入文本, 抽取出项目自定义的规则键 (形如 ``<PREFIX>-RULE-KEY`` 或类似约定, 例如 ``ZLG-RULE-NO-LOG-EXC``). 不要假设规则键的前缀, 直接看实际出现的字面量.
- 对每一条被本次 diff 违反的规则, 在 ``suggestion_content`` 里逐条 cite (例如 "违反 `ZLG-RULE-NO-LOG-EXC`"); ``improved_code`` 必须落实该规则的具体修复方式, 不能只是泛泛改写.
- 同一规则在多个 chunk 里被违反时, 每个 chunk 都要 cite 一次; 但不要为同一条规则生成重复的修复建议.
- 如果 AGENTS.md 写了非规则性的规约 (例如 "commit 规范 / 分支命名"), 也按字面遵循.
- 如果本次 prompt 没有注入 AGENTS.md (即 ``repo_context_files`` 没配置或文件缺失), 跳过规则键 cite, 只输出常规改进建议.

# AGENTS.md 触发的修复必须以可应用 suggestion 形式输出 (覆盖上游 prompt 的 "Don't suggest ..." 约束)
- 当一条 ``ZLG-RULE-*`` (或任何 AGENTS.md 里声明的规则键) 在 PR diff 中被违反时, **必须**在 YAML 的 ``code_suggestions`` 列表里输出一条对应的 suggestion, **不能**只在 ``# PR Code Suggestions`` 的主 review 折叠里写纯文本描述. Apply 按钮是这次评审要交付的核心 UX, 缺失 = 任务未完成.
- 违反此约束的常见情况是 AGENTS.md 要求"删除某行" (例如 ZLG-RULE-FORBIDDEN-COMMENT 要求删除含 ``ZLG-VIOLATION-MARKER`` 字面量的注释行): 这种情况下:
    - ``existing_code`` = 那一行 marker 注释 (含前导空格, 与 diff 中原样)
    - ``improved_code`` = 空字符串 (或下一个相邻非空行, 但**不要**插入空白行)
    - ``suggestion_content`` = 中文一句话, 必须 verbatim 引用规则 key (例如 "违反 `ZLG-RULE-FORBIDDEN-COMMENT` (hard-stop): 提交中禁止 ``ZLG-VIOLATION-MARKER`` 字面量, 必须删除此行注释")
    - ``label`` = "security" 或 "critical bug", ``one_sentence_summary`` 用中文
- 这条豁免适用于 AGENTS.md / CLAUDE.md 中**显式列出**的规则键, 且覆盖范围包括:
    * 删除违规注释行 (例如 ZLG-RULE-FORBIDDEN-COMMENT)
    * 添加 docstring (ZLG-RULE-DOCSTRING-REQUIRED)
    * 添加类型注解 (ZLG-RULE-TYPEHINTS)
    * 用 ``logging.exception(...)`` 替换 ``except Exception: pass`` (ZLG-RULE-NO-LOG-EXC)
    * 用 ``logging.info(...)`` 替换生产路径的 ``print(...)`` (ZLG-RULE-NO-BARE-PRINT)
  这些 case 在 AGENTS.md 触发的语境下**必须**作为可应用 code_suggestions 输出, 即便上游 prompt 的 "Don't suggest to add docstring, type hints, or comments, to remove unused imports, or to use more specific exception types" 明确禁止. AGENTS.md 的规则键 override 上游默认.
  其它 (无 AGENTS.md 规则键依据的) 衍生的 "加 docstring / type hints / 删除 unused import" 建议仍遵循上游 prompt 约束, 不输出 code_suggestions 条目.
- 即使整条 PR 只有一个 ZLG-RULE 违规, 也要至少输出一条 code_suggestions; 不要因为"主 review 已经写了文字说明"就跳过 code_suggestions 字段.
"""

# dual_publishing_score_threshold keeps the summarized-table UX for the
# overview while also publishing inline DiffNotes for important suggestions.
# Set to -1 to disable the inline re-publish and rely on inline mode alone
# (the table will then no longer be emitted by /improve).
dual_publishing_score_threshold=-1 # -1 to disable, [0-10] to set the threshold (>=) for publishing a code suggestion both in a table and as committable
focus_only_on_problems=true
enable_help_text=false
enable_chat_text=false
persistent_comment=true
max_history_len=4
publish_output_no_suggestions=true
# suggestions scoring
suggestions_score_threshold=0 # [0-10]| recommend not to set this value above 8, since above it may clip highly relevant suggestions
new_score_mechanism=true
new_score_mechanism_th_high=9
new_score_mechanism_th_medium=7
# params for '/improve --extended' mode
auto_extended_mode=true
num_code_suggestions_per_chunk=3
max_number_of_calls = 3
parallel_calls = true

final_clip_factor = 0.8
decouple_hunks = false
# self-review checkbox
demand_code_suggestions_self_review=false # add a checkbox for the author to self-review the code suggestions
code_suggestions_self_review_text= "**Author self-review**: I have reviewed the PR code suggestions, and addressed the relevant ones."
approve_pr_on_self_review=false # if true, the PR will be auto-approved after the author clicks on the self-review checkbox
fold_suggestions_on_self_review=true # if true, the code suggestions will be folded after the author clicks on the self-review checkbox

[pr_custom_prompt] # /custom_prompt #
prompt = """\
The code suggestions should focus only on the following:
- ...
- ...
...
"""
suggestions_score_threshold=0
num_code_suggestions_per_chunk=3
self_reflect_on_custom_suggestions=true
enable_help_text=false


[pr_add_docs] # /add_docs #
extra_instructions = ""
docs_style = "Sphinx" # "Google Style with Args, Returns, Attributes...etc", "Numpy Style", "Sphinx Style", "PEP257", "reStructuredText"
file = ""              # in case there are several components with the same name, you can specify the relevant file
class_name = ""        # in case there are several methods with the same name in the same file, you can specify the relevant class name

[pr_update_changelog] # /update_changelog #
push_changelog_changes=false
extra_instructions = ""
add_pr_link=true
skip_ci_on_push=true

[pr_analyze] # /analyze #
enable_help_text=true

[pr_test] # /test #
extra_instructions = ""
testing_framework = "" # specify the testing framework you want to use
num_tests=3            # number of tests to generate. max 5.
avoid_mocks=true       # if true, the generated tests will prefer to use real objects instead of mocks
file = ""              # in case there are several components with the same name, you can specify the relevant file
class_name = ""        # in case there are several methods with the same name in the same file, you can specify the relevant class name
enable_help_text=false

[pr_improve_component] # /improve_component #
num_code_suggestions=4
extra_instructions = ""
file = ""              # in case there are several components with the same name, you can specify the relevant file
class_name = ""        # in case there are several methods with the same name in the same file, you can specify the relevant class name

[pr_help] # /help #
force_local_db=false
num_retrieved_snippets=5

[pr_config] # /config #

[pr_help_docs]
repo_url = "" #If not overwritten, will use the repo from where the context came from (issue or PR)
repo_default_branch = "main"
docs_path = "docs"
exclude_root_readme = false
supported_doc_exts = [".md", ".mdx", ".rst"]
enable_help_text=false

[github]
# The type of deployment to create. Valid values are 'app' or 'user'.
deployment_type = "user"
ratelimit_retries = 5
base_url = "https://api.github.com"
publish_inline_comments_fallback_with_verification = true
try_fix_invalid_inline_comments = true
app_name = "pr-agent"
ignore_bot_pr = true
publish_as_check_run = false # when true, publish review/description/improve output as GitHub Checks instead of PR comments

[github_action_config]
# auto_review = true    # set as env var in .github/workflows/pr-agent.yaml
# auto_describe = true  # set as env var in .github/workflows/pr-agent.yaml
# auto_improve = true   # set as env var in .github/workflows/pr-agent.yaml
# pr_actions = ['opened', 'reopened', 'ready_for_review', 'review_requested']
# handle_push_trigger = false  # when true, handle synchronize events using push_commands (falls back to github_app.handle_push_trigger)
# push_trigger_ignore_bot_commits = true
# push_trigger_ignore_merge_commits = true
# push_commands = ['/describe', '/review']  # defaults mirror github_app.push_commands

[github_app]
# these toggles allows running the github app from custom deployments
bot_user = "github-actions[bot]"
override_deployment_type = true
# settings for "pull_request" event
handle_pr_actions = ['opened', 'reopened', 'ready_for_review']
pr_commands = [
    "/describe --pr_description.final_update_message=false",
    "/review",
    "/improve",
]
# settings for "pull_request" event with "synchronize" action - used to detect and handle push triggers for new commits
handle_push_trigger = false
push_trigger_ignore_bot_commits = true
push_trigger_ignore_merge_commits = true
push_trigger_wait_for_initial_review = true
push_trigger_pending_tasks_backlog = true
push_trigger_pending_tasks_ttl = 300
push_commands = [
    "/describe",
    "/review",
]

[gitlab]
url = "https://gitlab.com"
expand_submodule_diffs = false
# On MR open/reopen we run the full pipeline: /describe updates the MR body,
# /review writes the review summary, /improve drops inline suggestions.
# Subsequent pushes re-run the same pipeline so the review follows the
# latest commit; /describe skips rewriting the MR body (handled by
# final_update_message=false) and /improve /publish_output=false prevents
# double posting.
pr_commands = [
    "/describe --pr_description.final_update_message=false",
    "/review",
    "/improve",
]
# Re-run the pipeline on every new commit so reviewers always see
# findings against the latest code. /describe + /review are cheap on a
# small MR; /improve is bounded by num_code_suggestions so a noisy push
# cannot blow the prompt budget.
handle_push_trigger = true
push_commands = [
    "/describe --pr_description.final_update_message=false",
    "/review",
    "/improve",
]
# Configure SSL validation for GitLab. Can be either set to the path of a custom CA or disabled entirely.
# ssl_verify = true

[gitea]
url = "https://gitea.com"
handle_push_trigger = false
pr_commands = [
    "/describe",
    "/review",
    "/improve",
]
push_commands = [
    "/describe",
    "/review",
]

[bitbucket_app]
pr_commands = [
    "/describe --pr_description.final_update_message=false",
    "/review",
    "/improve --pr_code_suggestions.commitable_code_suggestions=true",
]
avoid_full_files = false

[local]
# LocalGitProvider settings - uncomment to use paths other than default
# description_path= "path/to/description.md"
# review_path= "path/to/review.md"

[gerrit]
# endpoint to the gerrit service
# url = "ssh://gerrit.example.com:29418"
# user for gerrit authentication
# user = "ai-reviewer"
# patch server where patches will be saved
# patch_server_endpoint = "http://127.0.0.1:5000/patch"
# token to authenticate in the patch server
# patch_server_token = ""

[bitbucket_server]
# URL to the BitBucket Server instance
# url = "https://git.bitbucket.com"
url = ""
pr_commands = [
    "/describe --pr_description.final_update_message=false",
    "/review",
    "/improve --pr_code_suggestions.commitable_code_suggestions=true",
]

[litellm]
# use_client = false
# drop_params = false
enable_callbacks = false
success_callback = []
failure_callback = []
service_callback = []
# model_id = "" # Optional: Custom inference profile ID for Amazon Bedrock

[pr_similar_issue]
skip_comments = false
force_update_dataset = false
max_issues_to_scan = 500
vectordb = "pinecone" # options: "pinecone", "lancedb", "qdrant"

[pr_find_similar_component]
class_name = ""
file = ""
search_from_org = false
allow_fallback_less_words = true
number_of_keywords = 5
number_of_results = 5

[pinecone]
# fill and place in .secrets.toml
#api_key = ...
# environment = "gcp-starter"

[lancedb]
uri = "./lancedb"

[qdrant]
# fill and place credentials in .secrets.toml
# url = "https://YOUR-QDRANT-URL"
# api_key = "..."

[skills]
# Agent skills (SKILL.md) support: discovers SKILL.md files from the configured
# filesystem paths and injects their content into review/improve/describe prompts.
# Sibling *.md files in the skill directory tree (e.g. references/guide.md) are
# inlined alongside SKILL.md. PR-Agent supports text-only skills: scripts/ and
# assets/ subdirectories are skipped because PR-Agent uses a single-shot model
# call (no tool-use loop) and cannot execute scripts or load binary assets on
# demand. Skills that depend on script execution will not work here.
# See https://github.com/The-PR-Agent/pr-agent/issues/2384
enabled = false
paths = [] # directories to scan recursively for "*/SKILL.md"; supports ~ and $VAR
max_skills_tokens = 8000 # token budget for the combined skills_context block

[best_practices]
content = ""
organization_name = ""
max_lines_allowed = 800
enable_global_best_practices = false

[auto_best_practices]
enable_auto_best_practices = true # public - general flag to disable all auto best practices usage
utilize_auto_best_practices = true # public - disable usage of auto best practices in the 'improve' tool
extra_instructions = "" # public - extra instructions to the auto best practices generation prompt
content = ""
max_patterns = 5 # max number of patterns to be detected

[artifacts]
# Enable artifact injection into tool prompts (off by default; auto-enabled when artifact_path input is set)
enable = false
# File path to the artifact (relative to GITHUB_WORKSPACE, or absolute)
artifact_path = ""
# Custom instructions appended after the artifact content (leave empty for a sensible default)
artifact_instructions = ""
# Label shown to the AI — defaults to the filename when empty
artifact_label = ""
# Which tools receive artifact context
target_tools = ["pr_reviewer", "pr_description", "pr_code_suggestions"]
# Max artifact size in characters (content is truncated if exceeded)
max_artifact_size = 50000

[azure_devops]
default_comment_status = "closed"

[azure_devops_server]
pr_commands = [
    "/describe",
    "/review",
    "/improve",
]
